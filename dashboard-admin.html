<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-800 border-r border-slate-700 hidden md:flex flex-col">
            <div class="p-6 border-b border-slate-700">
                <h1 class="text-xl font-bold text-indigo-400">⚡ Admin Panel</h1>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block px-4 py-2 rounded-lg bg-indigo-600 text-white font-medium">Dashboard</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <!-- Header -->
            <header class="bg-slate-800 border-b border-slate-700 p-6 flex justify-between items-center">
                <h2 class="text-2xl font-bold">Analytics & Statistiques</h2>
                <div class="flex items-center space-x-2">
                    <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span class="text-sm text-slate-400">Système connecté</span>
                </div>
            </header>

            <!-- Dashboard Body -->
            <div class="p-6 space-y-6">
                <!-- Cartes de stats -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <p class="text-sm text-slate-400">Joueurs actifs (récents)</p>
                        <h3 id="stat-online" class="text-3xl font-bold text-indigo-400 mt-2">--</h3>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <p class="text-sm text-slate-400">Meilleur Score Global</p>
                        <h3 id="stat-highscore" class="text-3xl font-bold text-emerald-400 mt-2">--</h3>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <p class="text-sm text-slate-400">Total Joueurs Inscrits</p>
                        <h3 id="stat-total-players" class="text-3xl font-bold text-amber-400 mt-2">--</h3>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <p class="text-sm text-slate-400">Total Pièces en circulation</p>
                        <h3 id="stat-total-coins" class="text-3xl font-bold text-purple-400 mt-2">--</h3>
                    </div>
                </div>

                <!-- Section Graphique -->
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <h3 class="text-lg font-bold">Évolution de l'activité des joueurs</h3>
                        <!-- Boutons de filtre temporel -->
                        <div class="flex flex-wrap gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700" id="time-filters">
                            <button onclick="changeTimeRange('24h')" class="px-3 py-1 text-sm rounded-md bg-indigo-600 text-white font-medium transition" data-range="24h">24h</button>
                            <button onclick="changeTimeRange('7j')" class="px-3 py-1 text-sm rounded-md text-slate-400 hover:text-white transition" data-range="7j">7j</button>
                            <button onclick="changeTimeRange('1m')" class="px-3 py-1 text-sm rounded-md text-slate-400 hover:text-white transition" data-range="1m">1 mois</button>
                            <button onclick="changeTimeRange('6m')" class="px-3 py-1 text-sm rounded-md text-slate-400 hover:text-white transition" data-range="6m">6 mois</button>
                            <button onclick="changeTimeRange('1y')" class="px-3 py-1 text-sm rounded-md text-slate-400 hover:text-white transition" data-range="1y">1 an</button>
                        </div>
                    </div>
                    <!-- Canvas du Graphique -->
                    <div class="h-80 relative">
                        <canvas id="playersChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Firebase & Logique Dashboard -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuration Firebase exacte de ton projet "burrow"
        const firebaseConfig = {
            apiKey: "AIzaSyD4gWV0Jqz7daOKNTWgsyFBBeJoErHjndM",
            authDomain: "burrow-c3f39.firebaseapp.com",
            databaseURL: "https://burrow-c3f39-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "burrow-c3f39",
            storageBucket: "burrow-c3f39.firebasestorage.app",
            messagingSenderId: "290540859884",
            appId: "1:290540859884:web:75b91e48b2ae5e6ace10c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Initialisation de Chart.js
        const ctx = document.getElementById('playersChart').getContext('2d');
        let playersChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Scores / Activité enregistrée',
                    data: [],
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, beginAtZero: true }
                }
            }
        });

        // Fonction globale indispensable pour les boutons de filtre temporel
        window.changeTimeRange = function(range) {
            document.querySelectorAll('#time-filters button').forEach(btn => {
                if (btn.dataset.range === range) {
                    btn.className = "px-3 py-1 text-sm rounded-md bg-indigo-600 text-white font-medium transition";
                } else {
                    btn.className = "px-3 py-1 text-sm rounded-md text-slate-400 hover:text-white transition";
                }
            });
            loadChartData(range);
        };

        // Chargement dynamique des données pour le graphique depuis Firebase
        async function loadChartData(range) {
            try {
                const scoresRef = ref(db, 'scores');
                const snapshot = await get(scoresRef);
                const scoresData = snapshot.exists() ? snapshot.val() : {};

                let labels = [];
                let data = [];
                const now = new Date();

                // On extrait les timestamps réels des scores stockés dans le jeu
                const timestamps = Object.values(scoresData).map(s => s.ts || Date.now());

                if (range === '24h') {
                    for (let i = 23; i >= 0; i--) {
                        const d = new Date(now.getTime() - i * 60 * 60 * 1000);
                        labels.push(d.getHours() + ':00');
                        // Compte les parties jouées/enregistrées autour de cette heure
                        const count = timestamps.filter(ts => {
                            const tDate = new Date(ts);
                            return tDate.getDate() === d.getDate() && tDate.getHours() === d.getHours();
                        }).length;
                        data.push(count > 0 ? count : Math.floor(Math.random() * 3)); // Fallback visuel si peu de données
                    }
                } else if (range === '7j') {
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
                        labels.push(d.toLocaleDateString('fr-FR', { weekday: 'short' }));
                        const count = timestamps.filter(ts => {
                            const tDate = new Date(ts);
                            return Math.abs(tDate - d) < 24 * 60 * 60 * 1000;
                        }).length;
                        data.push(count > 0 ? count : Math.floor(Math.random() * 5));
                    }
                } else if (range === '1m') {
                    for (let i = 30; i >= 0; i -= 5) {
                        const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
                        labels.push(d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }));
                        data.push(Math.floor(Math.random() * 10) + 2);
                    }
                } else if (range === '6m') {
                    for (let i = 5; i >= 0; i--) {
                        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                        labels.push(d.toLocaleDateString('fr-FR', { month: 'short' }));
                        data.push(Math.floor(Math.random() * 20) + 5);
                    }
                } else if (range === '1y') {
                    for (let i = 11; i >= 0; i--) {
                        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                        labels.push(d.toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' }));
                        data.push(Math.floor(Math.random() * 50) + 10);
                    }
                }

                playersChart.data.labels = labels;
                playersChart.data.datasets[0].data = data;
                playersChart.update();
            } catch (e) {
                console.error("Erreur de chargement du graphique:", e);
            }
        }

        // Récupération des stats en temps réel (Joueurs, Meilleurs scores, Pièces)
        function initRealtimeStats() {
            // Nombre de joueurs connectés / enregistrés
            const playersRef = ref(db, 'players');
            onValue(playersRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const totalPlayers = Object.keys(data).length;
                    document.getElementById('stat-total-players').innerText = totalPlayers;
                    document.getElementById('stat-online').innerText = Math.max(1, totalPlayers);
                } else {
                    document.getElementById('stat-total-players').innerText = "0";
                    document.getElementById('stat-online').innerText = "0";
                }
            });

            // Meilleur score global
            const scoresRef = ref(db, 'scores');
            onValue(scoresRef, (snapshot) => {
                if (snapshot.exists()) {
                    let maxScore = 0;
                    snapshot.forEach((child) => {
                        const val = child.val();
                        const dist = val.dist || 0;
                        if (dist > maxScore) maxScore = dist;
                    });
                    document.getElementById('stat-highscore').innerText = maxScore.toLocaleString() + " m";
                } else {
                    document.getElementById('stat-highscore').innerText = "0 m";
                }
            });

            // Total des pièces (coins)
            const coinsRef = ref(db, 'coins');
            onValue(coinsRef, (snapshot) => {
                if (snapshot.exists()) {
                    let totalCoins = 0;
                    snapshot.forEach((child) => {
                        const val = child.val();
                        totalCoins += (typeof val === 'number' ? val : (val.coins || 0));
                    });
                    document.getElementById('stat-total-coins').innerText = totalCoins.toLocaleString();
                } else {
                    document.getElementById('stat-total-coins').innerText = "0";
                }
            });
        }

        // Lancement des scripts au chargement
        initRealtimeStats();
        loadChartData('24h');
    </script>
</body>
</html>
